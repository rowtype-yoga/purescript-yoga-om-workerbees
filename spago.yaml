workspace:
  packageSet:
    registry: 51.1.0
  extraPackages:
    node-workerbees:
      git: https://github.com/natefaubion/purescript-node-workerbees.git
      ref: v0.3.1
      dependencies:
        - aff
        - argonaut-core
        - effect
        - either
        - exceptions
        - maybe
        - newtype
        - parallel
        - prelude
        - transformers
        - unsafe-coerce
    yoga-om:
      path: ../purescript-yoga-om
    yoga-json:
      path: ../purescript-yoga-json

package:
  name: yoga-om-workerbees
  publish:
    version: 0.1.0
    license: MIT
    location:
      githubOwner: rowtype-yoga
      githubRepo: purescript-yoga-om-workerbees
  dependencies:
    - aff: ">=7.1.0 <8.0.0"
    - arraybuffer-types: ">=3.0.2 <4.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - console: ">=6.1.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.1.0 <7.0.0"
    - exceptions: ">=6.0.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - foreign-object: ">=4.1.0 <5.0.0"
    - functions: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - node-buffer: ">=9.0.0 <10.0.0"
    - node-workerbees: "*"
    - parallel: ">=7.0.0 <8.0.0"
    - partial: ">=4.0.0 <5.0.0"
    - prelude: ">=6.0.1 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - transformers: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
    - yoga-json: "*"
    - yoga-om: "*"
  test:
    main: Test.Main
    dependencies: []
